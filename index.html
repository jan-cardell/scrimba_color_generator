<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <form id="input-form">
            <input type="color" id="input-color" value="#F55A5A"/>
            <select name="schemes" id="input-scheme">
                <option value="monochrome">Monochrome</option>
                <option value="monochrome-dark">Monochrome-dark</option>
                <option value="monochrome-light">Monochrome-light</option>
                <option value="analogic">Analogic</option>
                <option value="complement">Complement</option>
                <option value="analogic-complement">Analogic-complement</option>
                <option value="triad">Triad</option>
            </select>
            <button>Get color scheme</button>
        </form>
        <div id='color-out'>
            <div id="color-set" class="colors" data-copy="hex-set"></div>
            <div id="color0" class="colors" data-copy="hex0"></div>
            <div id="color1" class="colors" data-copy="hex1"></div>
            <div id="color2" class="colors" data-copy="hex2"></div>
            <div id="color3" class="colors" data-copy="hex3"></div>
        </div>
        <div id="hex-codes">
            <p id="hex-set" class="hex" data-copy="hex-set">#F55A5A</p>
            <p id="hex0" class="hex" data-copy="hex0">#2B283A</p>
            <p id="hex1" class="hex" data-copy="hex1">#FBF3AB</p>
            <p id="hex2" class="hex" data-copy="hex2">#AAD1B6</p>
            <p id="hex3" class="hex" data-copy="hex3">#A626D3</p>
        </div>
        <div id="copy-message">
            <p>Copied!</p>
        </div>
        <script src="index.js"></script>
    </body>
</html>
